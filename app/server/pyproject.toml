[project]
name = "system1"
version = "0.1.0"
description = "system1 product server"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "clerk-backend-api>=7.0.0",
    "fastapi[standard]>=0.159.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system1"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real providers; skipped unless LIVE=1"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
